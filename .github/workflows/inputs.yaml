name: 01 - Type 1 Workflow input demo
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - qa
          - prod
      
      perfrom_smoke_test:
        description: Execute smoke test
        required: true
        type: boolean
        default: true

env:
  APPLICATION_NAME: flask-app
  DOCKER_USERNAME: manojdograaa
  IMAGE_TAG: v1.0.1

jobs:
  flask-ci-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Display Input Values
        run: |
          echo "Environment" ${{inputs.environment}}"
          echo "Perfrom smoke test: ${{inputs.perfrom_smoke_test}}"

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{env.DOCKER_USERNAME}}/${{env.APPLICATION_NAME}}:${{env.IMAGE_TAG}}

      - name: QA Validation
        if: ${{inputs.environment=='qa'}}
        run: |
          echo "Running QA Validation checks..."
          echo "Running security validation..."
          echo "Running Integration validation..."
          echo "QA Validation completed successfully"

      - name: Login to DockerHub
        if: ${{inputs.environment !='dev'}}
        uses: docker/login-action@v3
        with:
          username: ${{env.DOCKER_USERNAME}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push Docker Image
        if: ${{inputs.environment != 'dev'}}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{env.DOCKER_USERNAME}}/${{env.APPLICATION_NAME}}:${{env.IMAGE_TAG}}

      - name: Run Container
        run: |
          docker run -d\
          -p 5000:5000 \
          --name flask-container\
          ${{env.DOCKER_USERNAME}}/${{env.APPLICATION_NAME}}:${{env.IMAGE_TAG}}

      - name: Smoke Test
        if: ${{inputs.perfrom_smoke_test}}
        run: |
          sleep 5
          curl http://localhost:5000/health
          echo "smoke test compeleted successfully"

      - name: deploy to Kubernates
        if: ${{inputs.environment=='prod'}}
        run: |
          echo " deplopying applicaiton tp Production Kubernates cluster..."
          echo "Deployment completed successfully"
          
        
      
