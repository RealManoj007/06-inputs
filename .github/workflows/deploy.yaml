name: 02 - Reusable deployment Workflow
on:
  workflow_call:
    inputs:
      application_name:
        required: true
        type: string
      
      run_security_scan:
        required: true
        type: boolean

      replicas:
        required: true
        type: number
        
jobs:
  deploy-application-job:
    runs-on: ubuntu-latest
    steps:
      - name: Display deployment Parameters
        run: |
          echo "Application ${{inputs.application_name}}
          echo "Run Security Scan: ${{inputs.run_security_scan}}

      - name: Security Validation
        if: ${{inputs.run_security_scan}}
        run: |
          echo "Running security scan"
          echo "No critical vulnerabilities found."

      - name: Deploy Application
        run: |
          echo "Running security scan..."
          echo "No critical vulnerabilities found."
        
      - name: deployment completed
        run: |
          echo "Deployment completed successfully"
